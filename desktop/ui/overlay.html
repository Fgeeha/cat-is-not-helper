<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Выдели область</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: rgba(0, 0, 0, 0.22); cursor: crosshair; user-select: none; -webkit-user-select: none; }
    #hint { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: rgba(20, 20, 24, 0.85); color: #fff; font: 14px -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; padding: 8px 14px; border-radius: 10px; pointer-events: none; }
    #sel { position: fixed; display: none; border: 2px solid #F2A645; background: rgba(242, 166, 69, 0.12); box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.18); pointer-events: none; }
    #size { position: fixed; display: none; background: rgba(20, 20, 24, 0.85); color: #fff; font: 12px monospace; padding: 3px 7px; border-radius: 6px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="hint">Выдели область для котика · Esc — отмена</div>
  <div id="sel"></div>
  <div id="size"></div>
  <script>
    (function () {
      const { invoke } = window.__TAURI__.core;
      const label = window.__TAURI__.window.getCurrentWindow().label;
      const sel = document.getElementById('sel');
      const size = document.getElementById('size');
      let start = null;

      function rect(e) {
        const x = Math.min(start.x, e.clientX), y = Math.min(start.y, e.clientY);
        const w = Math.abs(e.clientX - start.x), h = Math.abs(e.clientY - start.y);
        return { x, y, w, h };
      }

      document.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        start = { x: e.clientX, y: e.clientY };
        sel.style.display = 'block';
        Object.assign(sel.style, { left: e.clientX + 'px', top: e.clientY + 'px', width: '0px', height: '0px' });
      });
      document.addEventListener('mousemove', (e) => {
        if (!start) return;
        const r = rect(e);
        Object.assign(sel.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
        size.style.display = 'block';
        size.textContent = `${Math.round(r.w)} × ${Math.round(r.h)}`;
        size.style.left = (r.x + r.w + 8) + 'px';
        size.style.top = (r.y + r.h + 8) + 'px';
      });
      document.addEventListener('mouseup', (e) => {
        if (!start) return;
        const r = rect(e);
        start = null;
        if (r.w < 4 || r.h < 4) { invoke('cancel_capture'); return; }
        sel.style.display = 'none';
        size.style.display = 'none';
        invoke('finish_capture', { label, x: r.x, y: r.y, width: r.w, height: r.h });
      });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') invoke('cancel_capture'); });
      document.addEventListener('contextmenu', (e) => { e.preventDefault(); invoke('cancel_capture'); });
    })();
  </script>
</body>
</html>
