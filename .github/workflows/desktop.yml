name: Desktop (Tauri)

on:
  push:
    branches: [Master]
    tags: ["v*"]
    paths-ignore:
      - "Sources/**"
      - "Resources/**"
      - "Package.swift"
      - "Makefile"
      - "scripts/**"
      - "*.md"
  pull_request:
    branches: [Master]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-15
            target: universal-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows 10/11 (exe)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - name: Linux rpm/deb/AppImage (RedOS)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 \
            libxtst-dev libxi-dev libx11-dev libgtk-3-dev pkg-config rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: npm install
        run: npm ci || npm install

      # Необязательная стабильная подпись macOS (те же секреты, что у нативной сборки).
      - name: Подготовка сертификата macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        run: |
          if [ -n "$P12_BASE64" ]; then
            echo "APPLE_CERTIFICATE=$P12_BASE64" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.MACOS_CERT_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.MACOS_CERT_IDENTITY }}" >> "$GITHUB_ENV"
          else
            echo "Сертификата нет, будет ad-hoc подпись"
          fi

      - name: Версия из тега
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}" node -e "
            const fs = require('fs');
            const v = process.env.VERSION;
            const conf = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(conf)); c.version = v; fs.writeFileSync(conf, JSON.stringify(c, null, 2));
            const pkg = 'package.json';
            const j = JSON.parse(fs.readFileSync(pkg)); j.version = v; fs.writeFileSync(pkg, JSON.stringify(j, null, 2));
            const cargo = 'src-tauri/Cargo.toml';
            fs.writeFileSync(cargo, fs.readFileSync(cargo, 'utf8').replace(/^version = \".*\"/m, 'version = \"' + v + '\"'));
            console.log('Версия: ' + v);
          "

      # Без приватного ключа артефакты апдейтера собрать нельзя — отключаем их, релиз всё равно выйдет.
      - name: Ключ подписи обновлений
        id: sign
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "updater=true" >> "$GITHUB_OUTPUT"
            echo "Ключ есть, собираю артефакты обновления"
          else
            echo "updater=false" >> "$GITHUB_OUTPUT"
            node -e "
              const fs = require('fs'); const p = 'src-tauri/tauri.conf.json';
              const c = JSON.parse(fs.readFileSync(p)); c.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync(p, JSON.stringify(c, null, 2));
            "
            echo "Секрета TAURI_SIGNING_PRIVATE_KEY нет: автообновление для этой сборки выключено"
          fi

      # Отдельная компиляция, чтобы ошибка Rust была видна в логе до упаковки.
      - name: Проверка компиляции
        shell: bash
        run: cd src-tauri && cargo check --release 2>&1 | tail -40

      - name: Сборка и релиз
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('CatIsNotHelper {0}', github.ref_name) || '' }}
          releaseBody: |
            Котик для macOS, Windows 10/11 и Linux (RedOS, rpm/deb/AppImage).

            - macOS: `.dmg` (Apple Silicon + Intel). Если сборка подписана ad-hoc, при первом запуске: правый клик → «Открыть».
            - Windows: `-setup.exe` (NSIS, ставится в профиль пользователя, без прав администратора). SmartScreen может предупредить о неизвестном издателе.
            - RedOS и другие RPM-дистрибутивы: `.rpm` — `sudo dnf install ./CatIsNotHelper-*.rpm`. Нужна сессия X11 для чтения нажатий.
            - Debian/Ubuntu: `.deb`. Любой Linux: `.AppImage` (умеет обновляться сам).

            Приложение само предложит обновиться до этой версии.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ startsWith(github.ref, 'refs/tags/v') && steps.sign.outputs.updater == 'true' }}
          updaterJsonPreferNsis: true

      - name: Артефакты (не релиз)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
