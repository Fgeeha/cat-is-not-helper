name: Сборка

on:
  push:
    branches: [Master]
    tags: ["v*"]
  pull_request:
    branches: [Master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Универсальный бандл macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Версии инструментов
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Кэш SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Необязательно: стабильная подпись, чтобы разрешение «Универсальный доступ»
      # переживало обновления. Секреты: MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, MACOS_CERT_IDENTITY.
      - name: Импорт сертификата подписи
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "Сертификата нет, будет ad-hoc подпись"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Сборка arm64 + x86_64
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}" RELEASE_BUILD=1
          fi
          ARCHS="arm64 x86_64" scripts/build-app.sh release

      - name: Проверка архитектур
        run: |
          BIN=build/CatIsNotHelper.app/Contents/MacOS/CatIsNotHelper
          lipo -archs "$BIN" | tee /dev/stderr | grep -q "x86_64" || { echo "нет x86_64"; exit 1; }
          lipo -archs "$BIN" | grep -q "arm64" || { echo "нет arm64"; exit 1; }
          codesign --verify --deep --strict build/CatIsNotHelper.app

      - name: Проверка рендера
        run: |
          BIN=build/CatIsNotHelper.app/Contents/MacOS/CatIsNotHelper
          "$BIN" --render cat.png ginger normal "" "ci"
          test -s cat.png

      - name: Архив
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="${GITHUB_SHA::7}"
          ditto -c -k --keepParent build/CatIsNotHelper.app "CatIsNotHelper-${VERSION}-universal.zip"
          echo "ZIP=CatIsNotHelper-${VERSION}-universal.zip" >> "$GITHUB_ENV"

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: CatIsNotHelper-universal
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
          body: |
            Универсальная сборка (Apple Silicon + Intel), macOS 13+.

            Приложение само предложит обновиться до этой версии через меню 🐾.
            Если сборка подписана ad-hoc, при первом запуске macOS спросит подтверждение:
            правый клик по приложению → «Открыть», либо `xattr -d com.apple.quarantine CatIsNotHelper.app`.
